<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9 – División y Pipeline</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
        table {
            font-size: 11px;
        }
        th {
            background-color: #f1f3f5 !important;
        }
        .table-container {
            max-height: 400px;
            overflow: auto;
        }
    </style>
</head>
<body>

<div class="container my-5">

    <!-- TÍTULO -->
    <h1 class="fw-bold text-center mb-3">
        Ejercicio 9 – División del Dataset y Pipeline
    </h1>
    <p class="text-center text-muted mb-4">
        
    </p>

    <!-- FORMULARIO -->
    <div class="card p-4 mb-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label class="form-label fw-semibold">Seleccionar Dataset</label>
            <input type="file" name="dataset" class="form-control mb-3" required>
            <button type="submit" class="btn btn-primary">
                Procesar Dataset
            </button>
        </form>
    </div>

    {% if tabla_original %}

    <!-- TABLA ORIGINAL -->
    <div class="card p-4 mb-4">
        <h5 class="fw-semibold mb-3">X_train.head(10)</h5>
        <div class="table-responsive table-container">
            {{ tabla_original|safe }}
        </div>
    </div>

    <!-- TABLA TRANSFORMADA -->
    <div class="card p-4 mb-4">
        <h5 class="fw-semibold mb-3">X_train_prep.head(10)</h5>
        <div class="table-responsive table-container">
            {{ tabla_transformada|safe }}
        </div>
    </div>

    {% endif %}

    <!-- VOLVER -->
    <a href="/" class="btn btn-secondary mt-3">
        ⬅ Volver
    </a>

</div>

</body>
</html>
