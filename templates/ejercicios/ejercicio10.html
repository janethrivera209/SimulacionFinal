<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 10</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">

    <h1 class="fw-bold text-center mb-4">
        Ejercicio 10 – División del Dataset
    </h1>

    <div class="card p-4 mb-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label class="form-label fw-semibold">Subir archivo ARFF</label>
            <input type="file" name="dataset" class="form-control mb-3" required>
            <button class="btn btn-primary" type="submit">
                Procesar
            </button>
        </form>
    </div>

    {% if tabla_datos %}

    <!-- TABLA 1 -->
    <div class="card p-4 mb-4">
        <h5 class="fw-semibold mb-3">Lectura de los Datos (data.head)</h5>
        <div class="table-responsive">
            {{ tabla_datos|safe }}
        </div>
    </div>

    <!-- TABLA 2 -->
    <div class="card p-4 mb-4">
        <h5 class="fw-semibold mb-3">Subconjunto de Entrenamiento (X_train.head)</h5>
        <div class="table-responsive">
            {{ tabla_xtrain|safe }}
        </div>
    </div>

    {% endif %}

    <a href="/" class="btn btn-secondary">⬅ Volver</a>

</div>

</body>
</html>
