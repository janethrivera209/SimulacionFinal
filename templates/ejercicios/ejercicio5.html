<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 5 - Carga de inmail</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 30px;
}
.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,.1);
}
h1 {
    margin-bottom: 20px;
}
button {
    padding: 10px 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
pre {
    background: #111;
    color: #0f0;
    padding: 15px;
    border-radius: 6px;
    font-size: 12px;
    max-height: 400px;
    overflow-y: auto;
}
a {
    display: inline-block;
    margin-top: 20px;
    color: #555;
    text-decoration: none;
}
</style>
</head>

<body>
<div class="container">

<h1>Ejercicio 5 – Carga del archivo </h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="dataset" required>
    <button type="submit">Procesar archivo</button>
</form>

{% if lineas %}
    
    <pre>
{% for l in lineas %}
{{ l }}
{% endfor %}
    </pre>
{% endif %}

<a href="/">⬅ Volver</a>

</div>
</body>
</html>
